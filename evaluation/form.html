<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <From method="post">
        <fieldset>
            <header>Blood Donation From</header>
            </legend>
            <table>
                <tr>
                    <td><label for="first name*">First Name*: </label></td>
                    <td><input type="text" id="first name*" First Name="first name" required></td>
                </tr>
                <tr>
                    <td><label for="last name*"> Last Name*: </label></td>
                    <td><input type="text" id="last Name*" Last Name* required></td>

                </tr>
                <tr>
                    <td><label for="company"> company: </label></td>
                    <td><input type="text" id="company" Company="company" required></td>
                </tr>

                <tr>
                    <td><label for="address 1*"> Address 1*: </label></td>
                    <td><input type="text" id="address 1*" Address 1*="address 1*" required></td>
                </tr>
                <tr>
                    <td><label for="address 2*"> Address 2*: </label></td>
                    <td><input type="text" id="address 2*" Address 2*="address 2*" required></td>
                </tr>
                <tr>

                    <td><label for="city*"> City*: </label></td>
                    <td><input type="text" id="city*" city*="city*" required></td>

                </tr>
                <tr>
                    <td>
                        <label for="state*"> State*: </label>
                    </td>
                    <td>
                        <select id="state " name : "State*">
                            <option>
                                Bangladesh
                            </option>
                            <option>
                                India
                            </option>
                            <option>
                                pakistan
                            </option>
                            <option>
                                USA
                            </option>
                        </select>

                    </td>

                </tr>



            </table>
        </fieldset>
    </From>
</body>

</html>
